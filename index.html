<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UML绘图工具</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#20252b;background:#f1f3f5;font:14px/1.5 "Microsoft YaHei",sans-serif}header{height:52px;background:#fff;border-bottom:1px solid #d9dee4;display:flex;align-items:center;padding:0 16px;gap:16px}header strong{font-size:18px}header span{color:#65717d}main{height:calc(100vh - 52px);display:grid;grid-template-columns:238px 1fr}aside{background:#fff;padding:13px;border-right:1px solid #d9dee4;overflow:auto}label{display:block;margin:0 0 11px;font-size:13px}input,select,textarea{display:block;width:100%;padding:7px;margin-top:4px;border:1px solid #cbd2d9;border-radius:4px;background:#fff;font:inherit}textarea{resize:vertical}button{padding:7px;border:1px solid #cbd2d9;border-radius:4px;background:#fff;cursor:pointer;font:inherit;font-size:13px}button:hover{background:#edf2f7}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.primary{grid-column:1/-1;color:#fff;background:#245a8d;border-color:#245a8d}hr{border:0;border-top:1px solid #e3e6ea;margin:13px 0}#status{font-size:12px;color:#64717e}.stage{overflow:auto;padding:16px}.paper{width:min(100%,1200px);min-width:780px;margin:auto;background:#fff;box-shadow:0 2px 12px #13283c18}svg{display:block;width:100%;height:auto;user-select:none}.diagram-title{font:25px "SimSun","Songti SC",serif;text-anchor:middle}.lane{stroke:#111;stroke-width:2}.lanehead{stroke:#111;stroke-width:2}.lanetext{font:21px "SimSun","Songti SC",serif;text-anchor:middle;dominant-baseline:middle;cursor:pointer}.edge{fill:none;stroke:#151719;stroke-width:2;cursor:pointer}.edge.selected{stroke:#2878bf;stroke-width:3}.edgetext{font:17px "SimSun","Songti SC",serif;text-anchor:middle;cursor:move}.node{cursor:move}.shape{fill:white;stroke:#111;stroke-width:2}.node.selected .shape{stroke:#2878bf;stroke-width:3}.node-label{font:20px "SimSun","Songti SC",serif;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.dot{fill:#111}.ring{fill:#fff;stroke:#111;stroke-width:2}.enddot{fill:#111}.hint{color:#6b7480;font-size:12px;margin:10px 0}
.edge-hit{fill:none;stroke:transparent;stroke-width:16;cursor:grab}.edge-hit:active{cursor:grabbing}.selected-lane{stroke:#2878bf;stroke-width:3}.selection{fill:none;stroke:#2878bf;stroke-width:2;stroke-dasharray:5 3;pointer-events:none}.resize{fill:#2878bf;stroke:white;stroke-width:2;cursor:nwse-resize}svg{touch-action:none}button:disabled{opacity:.45;cursor:default}button.active{background:#dcecff;border-color:#2878bf}.lane-divider{stroke:transparent;stroke-width:14;cursor:col-resize}
[hidden]{display:none!important}
.bend-handle{fill:white;stroke:#2878bf;stroke-width:2;cursor:move}.bend-handle.active{fill:#2878bf}.canvas-resize{fill:#2878bf;stroke:white;stroke-width:2;cursor:nwse-resize}
.paper{position:relative;width:1200px;height:1200px;min-width:0;flex:none}.paper svg{width:100%;height:100%}
.canvas-grip{position:absolute;z-index:5;background:transparent;touch-action:none}
.canvas-grip:hover,.canvas-grip.dragging{background:#2878bf88}
.canvas-grip-top,.canvas-grip-bottom{left:0;width:100%;height:12px;cursor:ns-resize}
.canvas-grip-top{top:-6px}.canvas-grip-bottom{bottom:-6px}
.canvas-grip-left,.canvas-grip-right{top:0;height:100%;width:12px;cursor:ew-resize}
.canvas-grip-left{left:-6px}.canvas-grip-right{right:-6px}
.canvas-grip::after{content:"";position:absolute;background:#2878bf88;border-radius:3px;pointer-events:none}
.canvas-grip-top::after,.canvas-grip-bottom::after{width:80px;height:4px;left:calc(50% - 40px);top:4px}
.canvas-grip-left::after,.canvas-grip-right::after{width:4px;height:80px;top:calc(50% - 40px);left:4px}
.marquee{fill:#2878bf22;stroke:#2878bf;stroke-width:1.5;stroke-dasharray:6 4;pointer-events:none}
.snap-guide{stroke:#1683c7;stroke-width:1.5;stroke-dasharray:7 5;pointer-events:none}
#contextMenu{position:fixed;z-index:20;min-width:130px;padding:5px;background:white;border:1px solid #cbd2d9;border-radius:5px;box-shadow:0 4px 14px #13283c30}
#contextMenu button{display:block;width:100%;border:0;text-align:left}
.palette-symbol{width:48px;height:38px;display:block;margin:0 auto;overflow:visible}[data-add]{min-height:65px}[data-add] span{display:block}
.endpoint-handle{fill:#fff;stroke:#e07b16;stroke-width:3;cursor:move}
</style>
</head>
<body>
<header><strong>UML绘图工具</strong><span>框选多个节点后右键对齐 · Ctrl 点击多选，Shift 拖动端点使连线限制八方向 · 选择“连线”后依次点击两个节点</span></header>
<main><aside><label>教材图稿<select id="catalog"></select></label>
<label>绘图模式<select id="mode"><option value="activity">活动图</option><option value="swimlane">泳道图</option><option value="sequence">序列图</option><option value="er">实体关系图</option><option value="component">构件图</option><option value="deployment">部署图</option><option value="classdiagram">类图</option><option value="usecase">用例图</option></select></label>
<label>基础模板<select id="template"><option value="">选择模板…</option><option value="blank">空白画布</option><option value="activity">照片分析与重试</option><option value="swimlane">恢复码重置密码（泳道）</option></select></label>
<p id="canvasSize" class="hint">画布 1200 × 1200；拖动画布边缘可调整大小</p>
<div class="buttons"><label>画布宽度<input id="canvasWidth" type="number" min="400" max="4000" step="10"></label><label>画布高度<input id="canvasHeight" type="number" min="400" max="6000" step="10"></label></div>
<hr><div class="buttons"><button data-add="action">＋ 活动框</button><button data-add="state">＋ 状态框</button><button data-add="activation">＋ 执行长条</button><button data-add="participant">＋ 参与者</button><button data-add="connector">＋ 回接圆圈</button><button data-add="entity">＋ 实体</button><button data-add="attribute">＋ 属性</button><button data-add="component">＋ 构件</button><button data-add="lifeline">＋ 生命线</button><button data-add="relationship">◇ 关系</button><button data-add="deployment">＋ 部署节点</button><button data-add="text">＋ 文字</button><button data-add="folder">软件文件夹</button><button data-add="class">分栏类框</button><button data-add="interface">接口圆圈</button><button data-add="actor">参与者小人</button><button data-add="usecase">用例椭圆</button><button data-add="system">系统边界</button><button data-add="decision">◇ 判断</button><button data-add="start">● 开始</button><button data-add="end">◎ 结束</button><button id="addLane">＋ 添加泳道</button><button id="connect">连线：关闭</button></div>
<div class="buttons"><button id="copy">复制节点</button><button id="paste">粘贴节点</button></div>
<hr><div class="buttons"><button id="undo">撤销</button><button id="redo">重做</button></div><hr><label>图标题<input id="title" value="未命名活动图"></label><label>选中内容（节点 / 连线 / 泳道）<textarea id="text" rows="3" placeholder="选择节点、连线或泳道后编辑"></textarea></label><div class="buttons"><label>节点宽度<input id="nodeWidth" type="number" min="1" max="4000"></label><label>节点高度<input id="nodeHeight" type="number" min="1" max="6000"></label></div><div id="connectionProperties" hidden><label>起点节点<select id="edgeFrom"></select></label><label>终点节点<select id="edgeTo"></select></label><div class="buttons"><label>起点位置<select id="fromPort"><option value="auto">自动</option><option value="t">上</option><option value="r">右</option><option value="b">下</option><option value="l">左</option></select></label><label>终点位置<select id="toPort"><option value="auto">自动</option><option value="t">上</option><option value="r">右</option><option value="b">下</option><option value="l">左</option></select></label><button id="addBend">增加拐点</button><button id="deleteBend">删除选中拐点</button></div><p class="hint">拖动橙色端点调整原节点上的连接位置；按住 Shift 使连线保持水平、垂直或 45° 对角方向。蓝色圆点用于调整路径。</p></div><div id="edgeStyleControls" hidden><label>箭头<select id="edgeArrow"><option value="solid">实心箭头</option><option value="open">空心箭头</option><option value="none">无箭头</option></select></label><label><input id="edgeDashed" type="checkbox">虚线</label></div><label>连线走向<select id="edgeRoute"><option value="straight">直线</option><option value="orthogonal">直角折线</option><option value="right">右侧回路线</option></select></label><div class="buttons"><button id="remove">删除选中</button><button id="edgeLabel">编辑连线文字</button></div>
<label id="laneColorControl" hidden>泳道颜色<input id="laneColor" type="color" value="#f0f5fa"></label>
<hr><div class="buttons"><button id="import">导入图稿</button><button id="exportFile">导出图稿</button><button id="save">保存到浏览器</button><button id="load">读取浏览器保存</button><button id="png" class="primary">导出 PNG 图片</button></div><input id="file" type="file" accept=".json,application/json" hidden><p id="status">自动保存已开启</p><p class="hint">导入/导出使用 JSON 图稿文件；PNG 保存为图片。序列图请保持状态框与生命线对齐；长条上下端是一次执行的起止。</p>
</aside><section class="stage"><div class="paper"><svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200"></svg><div class="canvas-grip canvas-grip-top" data-canvas-edge="top" title="拖动调整画布上边"></div><div class="canvas-grip canvas-grip-right" data-canvas-edge="right" title="拖动调整画布右边"></div><div class="canvas-grip canvas-grip-bottom" data-canvas-edge="bottom" title="拖动调整画布下边"></div><div class="canvas-grip canvas-grip-left" data-canvas-edge="left" title="拖动调整画布左边"></div></div></section></main>
<div id="contextMenu" hidden><button data-align="horizontal">水平对齐</button><button data-align="vertical">竖直对齐</button></div>
<script src="templates.js"></script>
<script src="diagram-render.js"></script><script src="initial.js"></script><script src="editor.js"></script>
</body></html>
